[package]
name = "paani"
version = "0.1.0"
edition = "2024"
description = "Open-source client for Roblox places"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
# Shared with Kahua Studio. To work on both at once, add a [patch] with local paths
# in .cargo/config.toml (see CLAUDE.md).
kahua-io = { git = "https://github.com/Username59138/kahua" }
kahua-render = { git = "https://github.com/Username59138/kahua" }
pollster = { version = "1.0.1", default-features = false }
winit = "0.30.13"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
# wgpu and image are much faster with optimizations.
opt-level = 2

[profile.release]
lto = "thin"
